<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>制作2012年世界杯分组表</title>
<style type="text/css">
<!--
body {
	font-size: 14px;								/* 设置整体页面文字大小为14像素 */
}
table {
	border-collapse: collapse;			/* 设置表格边框合并 */
	width: 800px;										/* 设置表格宽度为800像素 */
	margin: 0 auto;										/* 表格居中 */
}
th {
	background-color: #595959;			/* 教材原用 image/title.gif，资源包无此图，用深灰背景等效 */
	background-repeat: repeat-x;		/* 表头背景横向重复 */
	height: 25px;										/* 表头高度25像素 */
	line-height: 25px;								/* 表头行高25像素，文字居中 */
	color: #FFFFFF;										/* 表头文字白色 */
	border: 1px solid #5F5F5F;			/* 表头边框 */
	padding: 0 2px;										/* 表头内边距 */
}
td {
	border: 1px solid #5F5F5F;			/* 单元格边框 */
	height: 25px;										/* 单元格高度25像素 */
	line-height: 25px;								/* 单元格行高25像素 */
	padding-left: 5px;								/* 单元格左侧内边距5像素 */
}
.row {
	background-color: #D7D7D7;			/* 单数行（A/C/E/G组）背景色 */
	color: #000000;										/* 单数行文字颜色 */
}
-->
</style>
</head>

<body>
<table width="800" border="0" cellspacing="0" cellpadding="0">
	<tr>
		<th colspan="5" scope="col">2012世界杯分组表</th>
	</tr>
	<tr class="row">
		<td>A组</td>
		<td>南非</td>
		<td>墨西哥</td>
		<td>乌拉圭</td>
		<td>法国</td>
	</tr>
	<tr>
		<td>B组</td>
		<td>阿根廷</td>
		<td>韩国</td>
		<td>尼日利亚</td>
		<td>希腊</td>
	</tr>
	<tr class="row">
		<td>C组</td>
		<td>英格兰</td>
		<td>美国</td>
		<td>阿尔及利亚</td>
		<td>斯洛文尼亚</td>
	</tr>
	<tr>
		<td>D组</td>
		<td>德国</td>
		<td>澳大利亚</td>
		<td>加纳</td>
		<td>塞尔维亚</td>
	</tr>
	<tr class="row">
		<td>E组</td>
		<td>荷兰</td>
		<td>日本</td>
		<td>喀麦隆</td>
		<td>丹麦</td>
	</tr>
	<tr>
		<td>F组</td>
		<td>意大利</td>
		<td>新西兰</td>
		<td>巴拉圭</td>
		<td>斯洛伐克</td>
	</tr>
	<tr class="row">
		<td>G组</td>
		<td>巴西</td>
		<td>朝鲜</td>
		<td>科特迪瓦</td>
		<td>葡萄牙</td>
	</tr>
	<tr>
		<td>H组</td>
		<td>西班牙</td>
		<td>洪都拉斯</td>
		<td>智利</td>
		<td>瑞士</td>
	</tr>
</table>
</body>
</html>
